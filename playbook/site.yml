---
# ==============================
# Install Clickhouse
# ==============================
- name: Install Clickhouse
  hosts: clickhouse
  handlers:
    - name: Start clickhouse service
      become: true
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted
  tasks:
    - block:
        - name: Get clickhouse distrib
          ansible.builtin.get_url:
            url: "https://packages.clickhouse.com/rpm/stable/{{ item }}-{{ clickhouse_version }}.noarch.rpm"
            dest: "./{{ item }}-{{ clickhouse_version }}.rpm"
          with_items: "{{ clickhouse_packages }}"
      rescue:
        - name: Get clickhouse distrib
          ansible.builtin.get_url:
            url: "https://packages.clickhouse.com/rpm/stable/clickhouse-common-static-{{ clickhouse_version }}.x86_64.rpm"
            dest: "./clickhouse-common-static-{{ clickhouse_version }}.rpm"
    - name: Install clickhouse packages
      become: true
      ansible.builtin.yum:
        name:
          - clickhouse-common-static-{{ clickhouse_version }}.rpm
          - clickhouse-client-{{ clickhouse_version }}.rpm
          - clickhouse-server-{{ clickhouse_version }}.rpm
        disable_gpg_check: true
      notify: Start clickhouse service

    - name: Flush handlers
      meta: flush_handlers

    - name: Create database
      ansible.builtin.command: "clickhouse-client -q 'create database logs;'"
      register: create_db
      failed_when: create_db.rc != 0 and create_db.rc !=82
      changed_when: create_db.rc == 0
# ==========================================
# SECOND PLAY - Install and configure Vector
# ==========================================

- name: Intalling vector
  hosts: vector

  tasks:
    # Скачать пакеты для скачивания и установки
    - name: Install dependencies
      ansible.builtin.yum:
        name: ["wget", "tar", "gzip"]
        state: present
      become: true

    # Создать пользователя и группу для управления
    - name: Create vector group
      ansible.builtin.group:
        name: vector
        system: true
        state: present
      become: true

    - name: Create vector user
      ansible.builtin.user:
        name: vector
        group: vector
        system: true
        shell: /bin/false
        home: /var/lib/vector
      register: user_created
      become: true

    - name: Add vector to adm group (for log access)
      ansible.builtin.user:
        name: vector
        groups: adm
        append: true
      when: user_created.changed or user_created is success
      become: true

    # Создать директорию Vector
    - name: Create vecktor directory
      ansible.builtin.file:
        path: "{{ vector_install_dir }}"
        state: directory
        mode: "0755"
      become: true

    # Скачать и распаковать архив заданной версии
    - name: Download Vector archive
      ansible.builtin.get_url:
        url: "{{ vector_repo_url }}"
        dest: "/tmp/vector-{{ vector_version }}.tar.gz"
        mode: "0644"

    - name: Unpack Vector
      ansible.builtin.unarchive:
        src: "/tmp/vector-{{ vector_version }}.tar.gz"
        dest: "{{ vector_install_dir }}"
        remote_src: true
        extra_opts: ["--strip-components=1"]
        creates: "{{ vector_install_dir }}/bin/vector"
        owner: vector
        group: vector
      become: true

    - name: Install Vector binary
      ansible.builtin.copy:
        src: "{{ vector_install_dir }}/vector-x86_64-unknown-linux-gnu/bin/vector"
        dest: "/usr/local/bin/vector"
        mode: "0755"
        remote_src: true
        owner: root
        group: root
      become: true

    - name: Create directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
        mode: "0755"
      loop:
        - { path: "/etc/vector", owner: "root", group: "root" }
        - {
            path: "{{ vector_data_dir }}",
            owner: "{{ vector_user }}",
            group: "{{ vector_group }}",
          }
        - {
            path: "{{ vector_log_dir }}",
            owner: "{{ vector_user }}",
            group: "{{ vector_group }}",
          }
      become: true

    - name: Restore SELinux contexts
      ansible.builtin.command: restorecon -RvF {{ item }}
      loop:
        - /etc/vector
        - "{{ vector_data_dir }}"
        - "{{ vector_log_dir }}"
      become: true
      changed_when: false

    # сохранить настройки сервиса
    - name: Deploy config
      ansible.builtin.template:
        src: vector.toml.j2
        dest: "{{ vector_config_path }}"
        mode: "0640"
        owner: vector
        group: vector
      become: true

    - name: Deploy Vector config
      ansible.builtin.template:
        src: vector.service.j2
        dest: "/etc/systemd/system/vector.service"
        owner: vector
        group: vector
        mode: "0644"
      become: true

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      become: true

    - name: Enable and start Vector
      ansible.builtin.systemd:
        name: vector
        state: started
        enabled: true
      become: true

    - name: Start vector service
      ansible.builtin.service:
        name: vector
        state: restarted
      become: true

    - name: Verify Vector installation
      block:
        - name: Check Vector version
          ansible.builtin.command: "/usr/local/bin/vector --version"
          register: vector_version_check
          changed_when: false

        - name: Display Vector version
          ansible.builtin.debug:
            msg: "Successfully installed Vector version: {{ vector_version_check.stdout }}"
      rescue:
        - name: Show installation error
          ansible.builtin.debug:

    - name: Check Vector service status
      ansible.builtin.systemd:
        name: vector
        daemon_reload: false
      register: vector_status
      changed_when: false
